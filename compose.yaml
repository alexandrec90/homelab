# The homelab stack. Every host-specific value comes from `.env` (see `.env.example`),
# and `COMPOSE_PROFILES` there picks which of the groups below a machine runs:
#
#   media   Jellyfin, Plex
#   cloud   Nextcloud and its database, cache and cron
#   dns     Pi-hole
#
# `tests/test_stack.py` holds this file to the rules in `homelab/stack.py`. Hardware
# transcoding depends on the host, so its `devices:` entries go in `compose.override.yaml`
# (gitignored, read automatically), not here.

x-common: &common
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "3"

services:
  jellyfin:
    <<: *common
    image: jellyfin/jellyfin:12.4
    profiles: [media]
    user: "${PUID:-1000}:${PGID:-1000}"
    ports:
      - "${JELLYFIN_HTTP_PORT:-8096}:8096"
    environment:
      TZ: ${TZ:-Etc/UTC}
    volumes:
      - ${DATA_ROOT:-./data}/jellyfin/config:/config
      - ${DATA_ROOT:-./data}/jellyfin/cache:/cache
      - ${MEDIA_ROOT:-./media}:/media:ro

  plex:
    <<: *common
    image: plexinc/pms-docker:1.43.6.11085-d1e52e169
    profiles: [media]
    ports:
      - "${PLEX_HTTP_PORT:-32400}:32400"
    environment:
      TZ: ${TZ:-Etc/UTC}
      PLEX_UID: ${PUID:-1000}
      PLEX_GID: ${PGID:-1000}
      # Only read on first start, and each token expires in minutes.
      PLEX_CLAIM: ${PLEX_CLAIM:-}
      ADVERTISE_IP: ${PLEX_ADVERTISE_URL:-}
    volumes:
      - ${DATA_ROOT:-./data}/plex/config:/config
      - ${DATA_ROOT:-./data}/plex/transcode:/transcode
      - ${MEDIA_ROOT:-./media}:/data:ro

  nextcloud:
    <<: *common
    image: nextcloud:35.0.2-apache
    profiles: [cloud]
    depends_on:
      nextcloud-db:
        condition: service_healthy
      nextcloud-redis:
        condition: service_healthy
    ports:
      - "${NEXTCLOUD_HTTP_PORT:-8080}:80"
    environment:
      TZ: ${TZ:-Etc/UTC}
      MYSQL_HOST: nextcloud-db
      MYSQL_DATABASE: nextcloud
      MYSQL_USER: nextcloud
      MYSQL_PASSWORD: ${NEXTCLOUD_DB_PASSWORD:?set NEXTCLOUD_DB_PASSWORD in .env}
      NEXTCLOUD_ADMIN_USER: ${NEXTCLOUD_ADMIN_USER:-admin}
      NEXTCLOUD_ADMIN_PASSWORD: ${NEXTCLOUD_ADMIN_PASSWORD:?set NEXTCLOUD_ADMIN_PASSWORD in .env}
      NEXTCLOUD_TRUSTED_DOMAINS: ${NEXTCLOUD_TRUSTED_DOMAINS:-localhost}
      REDIS_HOST: nextcloud-redis
    volumes:
      - ${DATA_ROOT:-./data}/nextcloud/html:/var/www/html
    healthcheck:
      test: [CMD, curl, -fsS, -o, /dev/null, http://localhost/status.php]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 2m

  # Background jobs. Nextcloud's default of running them on page views stalls them on a
  # server nobody is looking at.
  nextcloud-cron:
    <<: *common
    image: nextcloud:35.0.2-apache
    profiles: [cloud]
    entrypoint: /cron.sh
    depends_on:
      nextcloud:
        condition: service_healthy
    volumes:
      - ${DATA_ROOT:-./data}/nextcloud/html:/var/www/html

  nextcloud-db:
    <<: *common
    image: mariadb:11.8.9
    profiles: [cloud]
    command: --transaction-isolation=READ-COMMITTED
    environment:
      TZ: ${TZ:-Etc/UTC}
      MARIADB_AUTO_UPGRADE: "1"
      MARIADB_DATABASE: nextcloud
      MARIADB_USER: nextcloud
      MARIADB_PASSWORD: ${NEXTCLOUD_DB_PASSWORD:?set NEXTCLOUD_DB_PASSWORD in .env}
      MARIADB_ROOT_PASSWORD: ${NEXTCLOUD_DB_ROOT_PASSWORD:?set NEXTCLOUD_DB_ROOT_PASSWORD in .env}
    volumes:
      - ${DATA_ROOT:-./data}/nextcloud/db:/var/lib/mysql
    healthcheck:
      test: [CMD, healthcheck.sh, --connect, --innodb_initialized]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  nextcloud-redis:
    <<: *common
    image: redis:8.10.3-alpine
    profiles: [cloud]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 10s
      timeout: 3s
      retries: 5

  pihole:
    <<: *common
    image: pihole/pihole:2026.10.1
    profiles: [dns]
    ports:
      - "${PIHOLE_DNS_PORT:-53}:53/tcp"
      - "${PIHOLE_DNS_PORT:-53}:53/udp"
      - "${PIHOLE_HTTP_PORT:-8053}:80/tcp"
    environment:
      TZ: ${TZ:-Etc/UTC}
      FTLCONF_webserver_api_password: ${PIHOLE_PASSWORD:?set PIHOLE_PASSWORD in .env}
      # Answering on all interfaces is what a published port on a bridge network needs.
      FTLCONF_dns_listeningMode: ALL
    volumes:
      - ${DATA_ROOT:-./data}/pihole:/etc/pihole
    cap_add:
      - SYS_NICE

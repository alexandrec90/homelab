# Dependency updates, one ecosystem per manifest this project actually has.
#
# Grouping is not cosmetic. Ungrouped, a weekly run opens one PR per package and
# every one of them costs a full PR Gate run. Minor/patch land as a single PR;
# majors stay individual so `dependabot-automerge.yml` can judge each on its own.
#
# Neither is `assignees`, which every entry carries. A Dependabot PR matches none of
# the tabs on github.com/pulls -- the bot is the author, it mentions nobody, and it
# requests no review -- so without an assignee these PRs are reachable only by opening
# this repository. Assignment is the one qualifier a config file can set that puts them
# in a view someone already reads.
#
# `versioning-strategy` on the Python entry keeps Dependabot to the lock. Without it,
# a grouped patch bump rewrote a library's `pandas>=2.2` as `pandas>=3.0.6`, and a
# project depending on that library, whose other dependencies needed `pandas<3`, went
# red on its own main. A floor says what the code needs; the lock says what was tested.
# `lockfile-only`, not `increase-if-necessary`: under that one the uv updater still
# rewrote `pyarrow>=17` as `pyarrow>=26.0.0`, a release the floor already allowed. The
# cost is that a deliberate `<N` cap is never widened by the bot; that is a person's call.
version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    assignees:
      - alexandrec90
    versioning-strategy: lockfile-only
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  # The image tags the stacks pin. Nothing rolls out until someone deploys.
  #
  # Majors are ignored because this is the one ecosystem the gate cannot judge: the tests
  # start no container, so a green run says nothing about whether two images work
  # together, and `dependabot-automerge.yml` merges every Dependabot PR that goes green.
  # mariadb 11.4 to 13.0 was green on every check while Nextcloud allowed 12.3 at most.
  # Nextcloud and MariaDB also upgrade their data files on start, with no way back. A major
  # is a person's change, made from each project's release notes. See docs/deploying.md.
  - package-ecosystem: docker-compose
    directories:
      - /stacks/*
    schedule:
      interval: weekly
    assignees:
      - alexandrec90
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
      # Immich is tracked by `scripts/immich-release.py` and its weekly workflow instead.
      # Its GHCR repositories carry a tag per pull-request build, so listing them took
      # this job about 5,000 requests, until GHCR answered 429 and the job failed. A
      # release is one API call, and it names the exact database image it was built
      # for, so all three images move together.
      - dependency-name: "*immich-app/immich-server"
      - dependency-name: "*immich-app/immich-machine-learning"
      - dependency-name: "*immich-app/postgres"
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  # The actions the workflows pin. Majors land as individual PRs and the auto-merge
  # classifier holds them for review.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    assignees:
      - alexandrec90
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"

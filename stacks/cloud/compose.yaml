# Nextcloud with its database, cache and cron worker. `nextcloud-db-dump` writes the
# database out daily, because the backup stack skips the live files.
x-common: &common
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "3"

services:
  nextcloud:
    <<: *common
    image: nextcloud:35.0.2-apache
    depends_on:
      nextcloud-db:
        condition: service_healthy
      nextcloud-redis:
        condition: service_healthy
    ports:
      - "8080:80"
    environment:
      TZ: ${TZ:-Etc/UTC}
      MYSQL_HOST: nextcloud-db
      MYSQL_DATABASE: nextcloud
      MYSQL_USER: nextcloud
      MYSQL_PASSWORD: ${NEXTCLOUD_DB_PASSWORD:?set NEXTCLOUD_DB_PASSWORD in .env}
      NEXTCLOUD_ADMIN_USER: ${NEXTCLOUD_ADMIN_USER:-admin}
      NEXTCLOUD_ADMIN_PASSWORD: ${NEXTCLOUD_ADMIN_PASSWORD:?set NEXTCLOUD_ADMIN_PASSWORD in .env}
      NEXTCLOUD_TRUSTED_DOMAINS: cloud.${HOMELAB_DOMAIN}
      OVERWRITEHOST: cloud.${HOMELAB_DOMAIN}
      OVERWRITEPROTOCOL: https
      TRUSTED_PROXIES: ${PROXY_ADDRESS}
      REDIS_HOST: nextcloud-redis
    volumes:
      - ${DATA_ROOT}/nextcloud/html:/var/www/html
    healthcheck:
      test: [CMD, curl, -fsS, -o, /dev/null, http://localhost/status.php]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 2m

  # Background jobs. Nextcloud's default of running them on page views stalls them on a
  # server nobody is looking at.
  nextcloud-cron:
    <<: *common
    image: nextcloud:35.0.2-apache
    entrypoint: /cron.sh
    depends_on:
      nextcloud:
        condition: service_healthy
    volumes:
      - ${DATA_ROOT}/nextcloud/html:/var/www/html

  nextcloud-db:
    <<: *common
    image: mariadb:11.8.9
    command: --transaction-isolation=READ-COMMITTED
    environment:
      TZ: ${TZ:-Etc/UTC}
      MARIADB_AUTO_UPGRADE: "1"
      MARIADB_DATABASE: nextcloud
      MARIADB_USER: nextcloud
      MARIADB_PASSWORD: ${NEXTCLOUD_DB_PASSWORD:?set NEXTCLOUD_DB_PASSWORD in .env}
      MARIADB_ROOT_PASSWORD: ${NEXTCLOUD_DB_ROOT_PASSWORD:?set NEXTCLOUD_DB_ROOT_PASSWORD in .env}
    volumes:
      - ${DATA_ROOT}/nextcloud/db:/var/lib/mysql
    healthcheck:
      test: [CMD, healthcheck.sh, --connect, --innodb_initialized]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  nextcloud-db-dump:
    <<: *common
    image: mariadb:11.8.9
    depends_on:
      nextcloud-db:
        condition: service_healthy
    entrypoint:
      - sh
      - -c
      - >-
        while true; do
        mariadb-dump --host=nextcloud-db --user=root --single-transaction --all-databases
        > /dumps/nextcloud.sql.tmp && mv /dumps/nextcloud.sql.tmp /dumps/nextcloud.sql;
        sleep 86400;
        done
    environment:
      MYSQL_PWD: ${NEXTCLOUD_DB_ROOT_PASSWORD:?set NEXTCLOUD_DB_ROOT_PASSWORD in .env}
    volumes:
      - ${DATA_ROOT}/nextcloud/dumps:/dumps

  nextcloud-redis:
    <<: *common
    image: redis:8.10.3-alpine
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 10s
      timeout: 3s
      retries: 5

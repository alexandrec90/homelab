# Puts this machine on your tailnet for access from anywhere, without opening a port.
# Optional until TAILSCALE_AUTHKEY is set. Use a reusable key: `.env` is shared.
x-common: &common
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "3"

services:
  tailscale:
    <<: *common
    image: tailscale/tailscale:v1.104.4
    hostname: ${HOMELAB_MACHINE}
    network_mode: host
    environment:
      TS_AUTHKEY: ${TAILSCALE_AUTHKEY:?set TAILSCALE_AUTHKEY in .env}
      TS_ROUTES: ${TAILSCALE_ROUTES}
      TS_STATE_DIR: /var/lib/tailscale
      TS_USERSPACE: "false"
    volumes:
      - ${DATA_ROOT}/tailscale:/var/lib/tailscale
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
